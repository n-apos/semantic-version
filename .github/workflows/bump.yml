name: Bump Version

on:
  workflow_call:
    inputs:
      ref:
        description: 'The git ref to checkout and extract version from'
        required: true
        type: string
    outputs:
      version:
        description: "The new version number"
        value: ${{ jobs.bump.outputs.version }}
      sha:
        description: "The new commit SHA after bumping the version"
        value: ${{ jobs.bump.outputs.sha }}

jobs:
  bump:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      sha: ${{ steps.commit_and_push.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine and Apply Version Increment
        id: versioning
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          TYPE=${BRANCH_NAME#release/}
          
          # Convert to uppercase
          INCREMENT_TYPE=$(echo "$TYPE" | tr '[:lower:]' '[:upper:]')
          
          # Replace hyphens with underscores (e.g. SUFFIX-INCREMENT -> SUFFIX_INCREMENT)
          INCREMENT_TYPE=${INCREMENT_TYPE//-/_}
          
          echo "Applying increment type: $INCREMENT_TYPE"
          
          ./gradlew incrementVersion --type=$INCREMENT_TYPE

      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(./gradlew printVersion -q | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit, Tag and Push
        id: commit_and_push
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.properties
          git commit -m "chore(bump_version): Bump version to ${{ steps.extract_version.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          git tag "v${{ steps.extract_version.outputs.version }}"
          git push origin HEAD:${{ inputs.ref }}
          git push origin "v${{ steps.extract_version.outputs.version }}"
